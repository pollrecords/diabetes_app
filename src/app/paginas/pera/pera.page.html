<ion-content>

    <div class="contenedor-imagen">
        <img class="imagen-fruta" src="/assets/pera.png" alt="Pera">
    </div>

    <div class="contenedor-texto">
        <ion-card class="tarjeta-texto">
            <ion-card-content>
                <div class="titulo-descripcion">Información de pera:</div>
                <ion-list class="lista-informacion">
                    <ion-item>Calorías: 57 kcal por cada 100g</ion-item>
                    <ion-item>Índice Glucémico: Bajo (38)</ion-item>
                    <ion-item>Aporte: Rica en fibra y potasio</ion-item>

                </ion-list>
            </ion-card-content>
        </ion-card>
    </div>
</ion-content>
