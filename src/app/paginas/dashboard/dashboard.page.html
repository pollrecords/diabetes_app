<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Recetas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-back-button routerLink="/inicio" class="boton-atras"></ion-back-button>

  <ion-list>
    <ion-item>
      <ion-label position="stacked">Nombre de la receta</ion-label>
      <ion-input [(ngModel)]="recipeName" placeholder="Curry picante de garbanzos"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Descripcion</ion-label>
      <ion-textarea [(ngModel)]="recipeDescription"
        placeholder="Un curry vegano abundante y lleno de sabor."></ion-textarea>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Tiempo de preparacion (minutos)</ion-label>
      <ion-input [(ngModel)]="prepTime" type="number"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Tiempo de coccion (minutos)</ion-label>
      <ion-input [(ngModel)]="cookTime" type="number"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Porciones</ion-label>
      <ion-input [(ngModel)]="servings" type="number"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Ingredientes (uno por linea como ingrediente: cantidad)</ion-label>
      <ion-textarea [(ngModel)]="ingredientsText" placeholder="Garbanzos: 2 latas&#10;Leche de coco: 1 lata">
      </ion-textarea>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Instrucciones (un paso por linea)</ion-label>
      <ion-textarea [(ngModel)]="instructionsText"
        placeholder="Sofrie cebolla, ajo y jengibre.&#10;Agrega curry en polvo y cocina 1 minuto.">
      </ion-textarea>
    </ion-item>
  </ion-list>

  <ion-button expand="block" class="ion-margin-top" (click)="submitRecipe()">
    Guardar receta
  </ion-button>

  <ion-button expand="block" fill="outline" class="ion-margin-top" (click)="addSampleRecipe()">
    Agregar receta de ejemplo
  </ion-button>

  <p *ngIf="message" class="ion-margin-top">{{ message }}</p>
</ion-content>
