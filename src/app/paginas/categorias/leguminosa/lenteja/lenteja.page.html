<ion-content>
    <ion-back-button routerLink="/recomendaciones" class="boton-atras"></ion-back-button>

    <div class="contenedor-imagen">
        <img class="imagen-leguminosa" src="/assets/lentejas.png" alt="Lenteja">
    </div>

    <div class="contenedor-texto">
        <ion-card class="tarjeta-texto">
            <ion-card-content>
                <div class="titulo-descripcion">Información de lenteja:</div>
                <ion-list class="lista-informacion">
                    <ion-item>Calorías: 116 kcal por cada 100g (cocidas)</ion-item>
                    <ion-item>Índice Glucémico: Bajo (25)</ion-item>
                    <ion-item>Aporte: Ácido Fólico, Magnesio y Hierro</ion-item>
                    <ion-item>Tip: Se cocinan más rápido que las lentejas comunes y son ideales para cremas o purés por su textura suave</ion-item>
                </ion-list>
            </ion-card-content>
        </ion-card>
    </div>
</ion-content>
