<ion-content>

    <div class="contenedor-imagen">
        <img class="imagen-verdura" src="/assets/apio.png" alt="Apio">
    </div>

    <div class="contenedor-texto">
        <ion-card class="tarjeta-texto">
            <ion-card-content>
                <div class="titulo-descripcion">Información de apio:</div>
                <ion-list class="lista-informacion">
                    <ion-item>Calorías: 16 kcal por cada 100g</ion-item>
                    <ion-item>Índice Glucémico: Muy Bajo (15)</ion-item>

                </ion-list>
            </ion-card-content>
        </ion-card>
    </div>
