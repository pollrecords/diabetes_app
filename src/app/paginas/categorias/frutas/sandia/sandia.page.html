<ion-content>
    <ion-back-button routerLink="/recomendaciones" class="boton-atras"></ion-back-button>

    <div class="contenedor-imagen">
        <img class="imagen-fruta" src="/assets/sandia.png" alt="Sandia">
    </div>

    <div class="contenedor-texto">
        <ion-card class="tarjeta-texto">
            <ion-card-content>
                <div class="titulo-descripcion">Información de sandía:</div>
                <ion-list class="lista-informacion">
                    <ion-item>Calorías: 30 kcal por cada 100g</ion-item>
                    <ion-item>Índice Glucémico: Alto (72)</ion-item>
                    <ion-item>Aporte: Hidratación y Licopeno</ion-item>
                    <ion-item>Tip: Cuidar porción (máx. 1 taza)</ion-item>
                </ion-list>
            </ion-card-content>
        </ion-card>
    </div>
</ion-content>
