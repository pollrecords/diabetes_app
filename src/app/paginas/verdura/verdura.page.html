<ion-header [translucent]="true">
</ion-header>

<ion-content>
  <ion-back-button routerLink="/inicio" class="boton-atras"></ion-back-button>

  <div class="boton-leguminosas">
    <ion-grid>
      <ion-row>
        <ion-col>
          <ion-button expand="block" color="transparent" routerLink="/recomendaciones">FRUTA</ion-button>
        </ion-col>
        <ion-col>
          <ion-button expand="block" color="transparent" routerLink="/verdura">VERDURA</ion-button>
        </ion-col>
        <ion-col>
          <ion-button expand="block" color="transparent" routerLink="/leguminosas">LEGUMINOSAS</ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>

  <div class="container">
    <ion-grid>
      <ion-row>
        <ion-col size="4">
          <ion-card class="card" color="transparent" button="true" routerLink="/apio">
            <ion-card-content>
              <img src="/assets/apio.png">
              <ion-button color="light" expand="block" fill="clear" routerLink="/apio">
                Apio
              </ion-button>
            </ion-card-content>
          </ion-card>
        </ion-col>
        <ion-col size="4">
          <ion-card class="card" color="transparent" button="true" routerLink="/brocoli">
            <ion-card-content>
              <img src="/assets/brocoli.png">
              <ion-button color="light" expand="block" fill="clear" routerLink="/brocoli">
                Brócoli
              </ion-button>
            </ion-card-content>
          </ion-card>
        </ion-col>
        <ion-col size="4">
          <ion-card class="card" color="transparent" button="true" routerLink="/calabaza">
            <ion-card-content>
              <img src="/assets/calabaza.png">
              <ion-button color="light" expand="block" fill="clear" routerLink="/calabaza">
                Calabaza
              </ion-button>
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>

      <ion-row>
        <ion-col size="4">
          <ion-card class="card" color="transparent" button="true" routerLink="/coliflor">
            <ion-card-content>
              <img src="/assets/coliflor.png">
              <ion-button color="light" expand="block" fill="clear" routerLink="/coliflor">
                Coliflor
              </ion-button>
            </ion-card-content>
          </ion-card>
        </ion-col>
        <ion-col size="4">
          <ion-card class="card" color="transparent" button="true" routerLink="/berenjena">
            <ion-card-content>
              <img src="/assets/berenjena.png">
              <ion-button color="light" expand="block" fill="clear" routerLink="/berenjena">
                Berenjena
              </ion-button>
            </ion-card-content>
          </ion-card>
        </ion-col>
        <ion-col size="4">
          <ion-card class="card" color="transparent" button="true" routerLink="/betabel">
            <ion-card-content>
              <img src="/assets/betabel.png">
              <ion-button color="light" expand="block" fill="clear" routerLink="/betabel">
                Betabel
              </ion-button>
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
